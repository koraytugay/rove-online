<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVE Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast"></div>
    <div id="gridOverlay"></div>
    <div class="button-container">
        <button id="selectAllBtn">Select All (A)</button>
        <button id="centerBtn">Center (C)</button>
        <button id="saveBtn">Save (S)</button>
        <button id="restoreBtn">Restore (R)</button>
        <button id="fullscreenBtn">Fullscreen (F)</button>
        <button id="hideBtn">Show/Hide (H)</button>
    </div>
    <div class="container">
        <div class="image-wrapper" id="wrapper1">
            <img src="resources/brain-front.png" class="draggable" id="img1" alt="Brain" data-name="brain">
            <button class="flip-btn">↻</button>
        </div>
        <div class="image-wrapper" id="wrapper2">
            <img src="resources/coil-front.png" class="draggable" id="img2" alt="Coil" data-name="coil">
            <button class="flip-btn">↻</button>
        </div>
        <div class="image-wrapper" id="wrapper3">
            <img src="resources/gripper-front.png" class="draggable" id="img3" alt="Gripper" data-name="gripper">
            <button class="flip-btn">↻</button>
        </div>
        <div class="image-wrapper" id="wrapper4">
            <img src="resources/laser-front.png" class="draggable" id="img4" alt="Laser" data-name="laser">
            <button class="flip-btn">↻</button>
        </div>
        <div class="image-wrapper" id="wrapper5">
            <img src="resources/motor-front.png" class="draggable" id="img5" alt="Motor" data-name="motor">
            <button class="flip-btn">↻</button>
        </div>
        <div class="image-wrapper" id="wrapper6">
            <img src="resources/sensor-front.png" class="draggable" id="img6" alt="Sensor" data-name="sensor">
            <button class="flip-btn">↻</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
