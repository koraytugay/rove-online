<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="button-container">
        <div class="button-group">
            <button id="selectAllBtn">Select All (A)</button>
            <button id="centerBtn">Center Images (C)</button>
        </div>
        <div class="button-group">
            <button id="saveBtn">Save State (S)</button>
            <button id="restoreBtn">Restore State (R)</button>
        </div>
    </div>
    <div class="container">
        <h1>Drag the images anywhere!</h1>
        <img src="resources/brain-front.png" class="draggable" id="img1" alt="Brain">
        <img src="resources/coil-front.png" class="draggable" id="img2" alt="Coil">
        <img src="resources/gripper-front.png" class="draggable" id="img3" alt="Gripper">
        <img src="resources/laser-front.png" class="draggable" id="img4" alt="Laser">
        <img src="resources/motor-front.png" class="draggable" id="img5" alt="Motor">
        <img src="resources/sensor-front.png" class="draggable" id="img6" alt="Sensor">
    </div>
    <script src="script.js"></script>
</body>
</html>
